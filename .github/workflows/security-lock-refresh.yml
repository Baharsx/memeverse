name: Refresh security lockfile (temporary hardening branch)

on:
  push:
    branches: [fix/memeverse-hardening-20261031]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Re-resolve dependencies and apply non-breaking security fixes
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Verify lockfile, tests and production build
        run: |
          npm ci
          npm run contracts:compile
          npm test
          NODE_ENV=production npm run build
      - name: Commit updated lockfile on hardening branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh locked dependencies for security"
            git push
          fi
