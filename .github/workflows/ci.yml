name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# CI runs deterministic, offline checks only. It holds no Circle credentials, never signs or
# broadcasts an Arc transaction, never deploys a contract, never funds a wallet, and never runs
# a privileged settlement execution. Every Arc write script is invoked manually.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NODE_ENV is deliberately not set for the whole job. A job-level `NODE_ENV: test` leaks into
    # the Vite build, which then emits a React *development* bundle — so the step that claimed to
    # verify the production build was validating something the project never ships. Each step
    # below declares the environment it actually needs.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run contracts:compile

      - name: Run backend, security, and contract tests
        env:
          NODE_ENV: test
        run: npm test

      # Deliberately `npm run build` rather than `npm run check`: check is `npm test && npm run
      # build`, which would run the whole suite a second time and — worse — under whichever
      # environment the build needs. Running the two halves as separate steps lets each have the
      # environment it genuinely requires.
      - name: Verify production build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=low
